name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://ais-dev-vjz5hjkvehacv2o4u33hs2-1003257184143.europe-west2.run.app' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://csrttkkrlahzuswsvnsb.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_CgY9WjSl4c2qtY4BHJabrw_rbIuuwZ6' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate and setup Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          if ! unzip -t android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper JAR is corrupt or missing. Downloading clean Gradle 8.14.3 wrapper JAR..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cbe-management-system-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
